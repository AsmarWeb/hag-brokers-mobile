name: Mobile checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npx expo install --check
        env:
          EXPO_OFFLINE: "1"
          CI: "1"
      - run: npx expo export --platform web --output-dir dist-web
        env:
          EXPO_OFFLINE: "1"
          CI: "1"
