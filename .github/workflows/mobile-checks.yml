name: Mobile Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format onboarding files
        run: npx prettier --write App.tsx src/core/authValidation.ts src/screens/Account.tsx tests/authValidation.test.ts tests/registration-config.test.ts
      - name: Commit formatting
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/core/authValidation.ts src/screens/Account.tsx tests/authValidation.test.ts tests/registration-config.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format onboarding changes"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: TypeScript and unit tests
        run: npm run check
      - name: API contract checks
        run: npm run api:check
